<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><title>PokéTracker GO v4</title>
<style>
:root{--bg:#080d18;--card:#111a2c;--card2:#18243b;--text:#f4f7ff;--muted:#9aa9c3;--line:#293753;--accent:#72a7ff;--good:#55d493}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#111d36,#080d18 42%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:#0b1221ee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);padding:12px 14px}.top{max-width:1250px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.logo{font-weight:950;font-size:22px}.logo span{color:var(--accent)}
.searchbox{display:flex;align-items:center;gap:8px;flex:1;max-width:650px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 7px 4px 13px}.searchbox input{flex:1;border:0;background:transparent;outline:0;padding:9px;color:var(--text);min-width:0}.searchbox button{padding:7px 9px}
.wrap{max-width:1250px;margin:auto;padding:18px 14px 50px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:15px;padding:12px}.stat small{color:var(--muted)}.stat b{display:block;font-size:21px;margin-top:2px}.progress{height:6px;background:#060a12;border-radius:99px;overflow:hidden;margin-top:7px}.bar{height:100%;background:var(--accent);width:0;transition:.2s}
.tabs{display:flex;gap:7px;overflow:auto;padding:15px 0 10px;scrollbar-width:none}.tabs button{white-space:nowrap}.tabs .on{background:var(--accent);color:#07101c;font-weight:850}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}.controls select,.controls button{cursor:pointer}.status{color:var(--muted);font-size:12px;margin-bottom:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}.card{background:linear-gradient(160deg,#16213a,#10182a);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 8px 25px #0003}.card.have{border-color:#55d49388}.head{display:flex;gap:11px;align-items:center}.pokeimg{width:76px;height:76px;object-fit:contain;background:#0a1120;border-radius:15px}.num{font-size:11px;color:var(--muted)}.name{font-size:18px;font-weight:900}.form{font-size:11px;color:#ffd166;margin-top:2px}
.qty{display:flex;align-items:center;gap:7px;margin-top:11px}.qty button{width:34px;height:34px;padding:0;font-size:20px}.qty input{width:70px;text-align:center}.checks{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}label{font-size:12px;display:flex;gap:6px;align-items:center}label input{accent-color:var(--good)}
.section{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}.sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.sizes input{width:100%;font-size:11px;padding:7px 3px;text-align:center}.size label{display:block;text-align:center;font-size:10px;color:var(--muted)}
.empty,.loading{text-align:center;color:var(--muted);padding:40px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:span 2}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:9px}.pokeimg{width:62px;height:62px}.name{font-size:16px}.checks{grid-template-columns:1fr}.sizes{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><div class="top"><div class="logo">⚡ Poké<span>Tracker</span> GO</div><div class="searchbox">🔎 <input id="search" placeholder="Buscar Pokémon, número ou forma"><button id="clear">×</button></div></div></header>
<main class="wrap"><section class="stats">
<div class="stat"><small>📖 Espécies</small><b id="species">0/0</b><div class="progress"><div id="bar" class="bar"></div></div></div>
<div class="stat"><small>🐾 Pokémon</small><b id="quantity">0</b></div><div class="stat"><small>✨ Brilhantes</small><b id="shiny">0</b></div><div class="stat"><small>🌑 Sombrosos</small><b id="shadow">0</b></div><div class="stat"><small>🖤 IV 0%</small><b id="nundo">0</b></div><div class="stat"><small>📏 Tamanhos</small><b id="sizes">0</b></div></section>
<nav id="tabs" class="tabs"></nav><div class="controls"><select id="status"><option value="all">Todos</option><option value="have">Tenho</option><option value="missing">Faltam</option></select><select id="generation"><option value="all">Todas as gerações</option></select><select id="subfilter"><option value="all">Todos</option><option value="base">Espécies</option><option value="forms">Formas</option></select><button id="wipe">🗑️ Apagar coleção</button></div>
<div id="statusText" class="status"></div><section id="grid" class="grid"><div class="loading">Carregando Pokémon…</div></section></main>
<script>
const API='https://raw.githubusercontent.com/WatWowMap/pogo-data-api/main/data/v1/';
const IMG='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/';
const cats={dex:'📖 Pokédex',shiny:'✨ Brilhantes',shadow:'🌑 Sombrosos',purified:'😇 Purificados',lucky:'🍀 Sortudos',hundo:'💯 100% IV',nundo:'🖤 0% IV',mega:'🔥 Mega',dynamax:'🌀 Dynamax',gigamax:'👑 Gigamax',costume:'🎭 Fantasias',regional:'🌎 Regionais',regionalForm:'🧬 Formas Regionais',unown:'🔤 Unown',legendary:'⭐ Lendários',mythical:'🔮 Míticos',ultra:'👽 Ultracriaturas',xxs:'🟢 XXS',xs:'🔵 XS',normalSize:'⚪ Normal',xl:'🟠 XL',xxl:'🔴 XXL'};
let mons=[],forms=[],costumes=[],cat='dex',state=JSON.parse(localStorage.getItem('poketracker_v4')||'{}');
const tabs=document.getElementById('tabs');Object.entries(cats).forEach(([k,v])=>{let b=document.createElement('button');b.textContent=v;b.dataset.k=k;b.onclick=()=>{cat=k;render()};tabs.appendChild(b)});
const key=(id,c)=>String(id)+'|'+c,get=(id,c)=>!!state[key(id,c)],num=(id,c)=>Number(state[key(id,c)]||0);
function persist(){localStorage.setItem('poketracker_v4',JSON.stringify(state))}
function setNum(id,c,v){v=Math.max(0,parseInt(v||0,10)||0);if(v)state[key(id,c)]=v;else delete state[key(id,c)];persist();render()}
function setFlag(id,c,v){if(v)state[key(id,c)]=1;else delete state[key(id,c)];persist();render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function formName(f){return f?.formName||f?.form||f?.name||''}
function records(){let out=[];mons.forEach(m=>{let ids=new Set(m.forms||[]),rel=forms.filter(f=>ids.has(f.formId));if(rel.length)rel.forEach(f=>out.push({m,f}));else out.push({m,f:null})});return out}
function idOf(r){return r.f?.formId?r.m.pokedexId+'-'+r.f.formId:r.m.pokedexId}
function applicable(r){let m=r.m,n=formName(r.f).toLowerCase();if(cat==='dex')return !r.f||r.f.formId===m.defaultFormId;if(cat==='legendary')return !!m.legendary;if(cat==='mythical')return !!m.mythic;if(cat==='ultra')return !!m.ultraBeast;if(cat==='mega')return n.includes('mega')||n.includes('primal')||(m.tempEvolutions||[]).length>0;if(cat==='gigamax')return n.includes('gigantamax')||n.includes('gigamax');if(cat==='dynamax')return n.includes('dynamax')||n.includes('gigantamax')||n.includes('gigamax');if(cat==='regional')return !!m.regional || [83,115,122,128,185,214,222,313,314,324,337,338,357,369,370,417,441,451,452,455,480,481,482,511,512,513,514,515,516,538,539,550,556,561,626,631,632,641,642,645,701,707,713,741,764,797,798,799,803,804,805,806].includes(m.pokedexId); if(cat==='regionalForm')return ['alola','galar','hisui','paldea'].some(x=>n.includes(x));if(cat==='unown')return m.pokedexId===201;if(cat==='costume')return !!(r.f&&(r.f.costumeId||r.f.costumeName))||costumes.some(c=>c.pokemonId===m.pokedexId);return !r.f||r.f.formId===m.defaultFormId}
function checks(r){let id=idOf(r);return `<div class="checks"><label><input type="checkbox" ${get(id,cat)?'checked':''} onchange="setFlag('${id}','${cat}',this.checked)"> Tenho</label><label><input type="checkbox" ${get(id,'shiny')?'checked':''} onchange="setFlag('${id}','shiny',this.checked)"> ✨ Shiny</label><label><input type="checkbox" ${get(id,'shadow')?'checked':''} onchange="setFlag('${id}','shadow',this.checked)"> 🌑 Shadow</label><label><input type="checkbox" ${get(id,'purified')?'checked':''} onchange="setFlag('${id}','purified',this.checked)"> 😇 Purificado</label><label><input type="checkbox" ${get(id,'lucky')?'checked':''} onchange="setFlag('${id}','lucky',this.checked)"> 🍀 Sortudo</label><label><input type="checkbox" ${get(id,'hundo')?'checked':''} onchange="setFlag('${id}','hundo',this.checked)"> 💯 100%</label><label><input type="checkbox" ${get(id,'nundo')?'checked':''} onchange="setFlag('${id}','nundo',this.checked)"> 🖤 0%</label></div>`}
function sizes(r){let id=idOf(r),a=[['xxs','XXS'],['xs','XS'],['normalSize','Normal'],['xl','XL'],['xxl','XXL']];return `<div class="section"><div class="form">Tamanhos</div><div class="sizes">${a.map(([c,l])=>`<div class="size"><label>${l}</label><input type="number" min="0" value="${num(id,c)}" onchange="setNum('${id}','${c}',this.value)"></div>`).join('')}</div></div>`}
function card(r){let id=idOf(r),q=num(id,'qty'),owned=q>0||get(id,'dex'),img=IMG+r.m.pokedexId+'.png';return `<article class="card ${owned?'have':''}"><div class="head"><img class="pokeimg" loading="lazy" src="${img}" onerror="this.style.visibility='hidden'"><div><div class="num">#${String(r.m.pokedexId).padStart(4,'0')}</div><div class="name">${esc(r.m.pokemonName)}</div>${r.f&&formName(r.f)?`<div class="form">${esc(formName(r.f))}</div>`:''}</div></div><div class="qty"><button onclick="setNum('${id}','qty',${q-1})">−</button><input type="number" min="0" value="${q}" onchange="setNum('${id}','qty',this.value)"><button onclick="setNum('${id}','qty',${q+1})">+</button><span class="num">total</span></div>${checks(r)}${cat==='dex'?sizes(r):''}</article>`}
function render(){tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===cat));let q=document.getElementById('search').value.toLowerCase().trim(),gen=document.getElementById('generation').value,sub=document.getElementById('subfilter').value,st=document.getElementById('status').value;let arr=records().filter(r=>(!q||r.m.pokemonName.toLowerCase().includes(q)||String(r.m.pokedexId)===q||formName(r.f).toLowerCase().includes(q))&&(gen==='all'||String(r.m.genId)===gen)&&applicable(r));if(sub==='base')arr=arr.filter(r=>!r.f||r.f.formId===r.m.defaultFormId);if(sub==='forms')arr=arr.filter(r=>r.f&&r.f.formId!==r.m.defaultFormId);if(st!=='all')arr=arr.filter(r=>st==='have'?get(idOf(r),cat):!get(idOf(r),cat));document.getElementById('grid').innerHTML=arr.length?arr.slice(0,1500).map(card).join(''):'<div class="empty">Nenhum Pokémon encontrado.</div>';document.getElementById('statusText').textContent=arr.length+' registros exibidos';update()}
function update(){let species=mons.filter(m=>num(m.pokedexId,'qty')>0||get(m.pokedexId,'dex')).length,total=mons.reduce((s,m)=>s+num(m.pokedexId,'qty'),0);document.getElementById('species').textContent=species+'/'+mons.length;document.getElementById('bar').style.width=(mons.length?species/mons.length*100:0)+'%';document.getElementById('quantity').textContent=total;document.getElementById('shiny').textContent=Object.keys(state).filter(k=>k.endsWith('|shiny')).length;document.getElementById('shadow').textContent=Object.keys(state).filter(k=>k.endsWith('|shadow')).length;document.getElementById('nundo').textContent=Object.keys(state).filter(k=>k.endsWith('|nundo')).length;document.getElementById('sizes').textContent=Object.keys(state).filter(k=>/\|(xxs|xs|normalSize|xl|xxl)$/.test(k)).length}
async function load(){try{let [p,f,c]=await Promise.all([fetch(API+'pokemon.json'),fetch(API+'forms.json'),fetch(API+'costumes.json')]);mons=await p.json();forms=await f.json();costumes=await c.json();[...new Set(mons.map(x=>x.genId).filter(Boolean))].sort((a,b)=>a-b).forEach(g=>{let o=document.createElement('option');o.value=g;o.textContent='Geração '+g;document.getElementById('generation').appendChild(o)});render()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">Não consegui carregar os dados. Abra o app com internet e tente novamente.</div>'}}
document.getElementById('search').oninput=render;document.getElementById('clear').onclick=()=>{document.getElementById('search').value='';render()};document.getElementById('status').onchange=render;document.getElementById('generation').onchange=render;document.getElementById('subfilter').onchange=render;document.getElementById('wipe').onclick=()=>{if(confirm('Apagar toda a coleção deste aparelho?')){state={};persist();render()}};load();
</script></body></html>
